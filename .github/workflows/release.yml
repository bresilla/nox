name: release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  release:
    name: release static nox binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - name: Build static binary
        run: |
          nix build .#nox-static --print-out-paths
          # `nox` is what install.sh fetches; keep an arch-named copy too.
          cp result/bin/nox nox
          cp result/bin/nox nox-linux-amd64
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nox
            nox-linux-amd64
