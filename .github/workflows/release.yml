name: release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  release:
    name: release nox-linux-amd64 (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - name: Build static binary
        run: |
          nix build .#nox-static --print-out-paths
          cp result/bin/nox nox-linux-amd64
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: nox-linux-amd64
